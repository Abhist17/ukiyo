[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"        # transient storage (EIP-1153) is used for per-swap scratch values
bytecode_hash = "none"
optimizer = true
optimizer_runs = 800
via_ir = false
# Remappings come only from remappings.txt. Forge would otherwise add ones it infers from inside lib/, and editors
# that resolve imports with simpler rules than forge (VS Code's Solidity extension) mis-resolve those.
auto_detect_remappings = false
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }, { access = "read-write", path = "web/src/deployments/" }]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
